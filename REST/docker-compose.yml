services:
  movie:
    build:
      context: .
      dockerfile: movie/Dockerfile
    ports:
      - "${MOVIE_PORT:-3200}:3200"

  booking:
    build:
      context: .
      dockerfile: booking/Dockerfile
    ports:
      - "${BOOKING_PORT:-3201}:3201"
    environment:
      MOVIE_URL: "${MOVIE_URL:-http://movie:3200}"
      SCHEDULE_URL: "${SCHEDULE_URL:-http://schedule:3202}"
    depends_on:
      - movie
      - schedule

  schedule:
    build:
      context: .
      dockerfile: schedule/Dockerfile
    ports:
      - "${SCHEDULE_PORT:-3202}:3202"
    environment:
      MOVIE_URL: "${MOVIE_URL:-http://movie:3200}"
    depends_on:
      - movie

  user:
    build:
      context: .
      dockerfile: user/Dockerfile
    ports:
      - "${USER_PORT:-3203}:3203"
