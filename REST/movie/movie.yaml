openapi: 3.0.3
info:
  title: Movie Service API
  description: API for browsing, adding, rating, and deleting movies.
  version: "1.0.0"
  contact:
    name: Cyril Tamine, Igor Gallea
    email: cyril.tamine@imt-atlantique.fr
servers:
  - url: http://localhost:3200
    description: Local development server

tags:
- name: admin
  description: Movie management operations (authentication is not implemented).
- name: dev
  description: Operations available to regular developers

paths:
  /:
    get:
      tags:
        - dev
      summary: Service home page
      description: Returns an HTML welcome message.
      responses:
        "200":
          description: HTML welcome message
          content:
            text/html:
              schema:
                type: string
                example: "<h1 style='color:blue'>Welcome to the Movie service!</h1>"

  /movies:
    get:
      tags:
        - dev
      summary: Retrieve the full list of movies
      description: Returns the list of all available movies.
      responses:
        "200":
          description: List of movies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Movie"

  /movies/{movieid}:
    get:
      tags:
        - dev
      summary: Retrieve a movie by its ID
      parameters:
        - $ref: "#/components/parameters/MovieId"
      responses:
        "200":
          description: Movie found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"
        "404":
          description: Movie ID not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      tags:
        - admin
      summary: Add a new movie
      description: The URL ID is used to detect duplicates. The movie is stored from the JSON request body.
      parameters:
        - $ref: "#/components/parameters/MovieId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Movie"
      responses:
        "200":
          description: Movie added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Movie added."
        "400":
          description: Malformed JSON request body
          content:
            text/html:
              schema:
                type: string
        "415":
          description: Request body must use a JSON content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Movie ID already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      tags:
        - admin
      summary: Delete a movie by its ID
      parameters:
        - $ref: "#/components/parameters/MovieId"
      responses:
        "200":
          description: Deleted movie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"
        "404":
          description: Movie ID not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /moviesbytitle:
    get:
      tags:
        - dev
      summary: Retrieve the first movie with an exact matching title
      parameters:
        - name: title
          in: query
          required: true
          description: Exact title of the movie to search for
          schema:
            type: string
            minLength: 1
            pattern: '\S'
      responses:
        "200":
          description: Movie found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"
        "400":
          description: Title query parameter missing or blank
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Movie title not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /movies/{movieid}/{rate}:
    put:
      tags:
        - admin
      summary: Update a movie's rating
      parameters:
        - $ref: "#/components/parameters/MovieId"
        - name: rate
          in: path
          required: true
          description: New numeric rating between 0 and 10
          schema:
            type: number
            minimum: 0
            maximum: 10
      responses:
        "200":
          description: Movie updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"
        "400":
          description: Rating must be a finite number between 0 and 10
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Movie ID not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  parameters:
    MovieId:
      name: movieid
      in: path
      required: true
      description: Unique identifier of the movie
      schema:
        type: string

  schemas:
    Movie:
      type: object
      description: Representation of a movie.
      properties:
        id:
          type: string
          minLength: 1
          description: Unique identifier stored in the movie's JSON body
          example: "720d006c-3a57-4b6a-b18f-9b713b073f3c"
        title:
          type: string
          minLength: 1
          pattern: '\S'
          description: Movie title
          example: "The Good Dinosaur"
        rating:
          type: number
          format: float
          minimum: 0
          maximum: 10
          description: Rating assigned to the movie
          example: 7.4
        director:
          type: string
          description: Movie director
          example: "Peter Sohn"
      required:
        - id
        - title

    Error:
      type: object
      properties:
        error:
          type: string
          example: "Movie ID not found"
