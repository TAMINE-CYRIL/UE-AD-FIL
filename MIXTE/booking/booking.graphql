type Query {
    bookings: [Booking]
    booking_by_user(userid: String!): Booking
}

type Mutation {
    add_booking(userid: String!, date: String!, movieid: String!): Booking
    delete_booking(userid: String!): Booking
    delete_booking_movie(userid: String!, date: String!, movieid: String!): Booking
}

type Booking {
    userid: String!
    dates: [DateBooking]
}

type DateBooking {
    date: String!
    movies: [String!]
    movies_details: [Movie]
}

type Movie {
    id: String!
    title: String!
    director: String!
    rating: Float!
}
