type Query {
    movies: [Movie]
    movie_with_id(_id: String!): Movie
    movie_by_title(title: String!): Movie
}

type Mutation {
    add_movie(_id: String!, title: String!, director: String!, rating: Float!): Movie
    update_movie_rate(_id: String!, _rate: Float!): Movie
    delete_movie(_id: String!): Movie
}

type Movie {
    id: String!
    title: String!
    director: String!
    rating: Float!
    actors: [Actor]
}

type Actor {
    id: String!
    firstname: String!
    lastname: String!
    birthyear: Int!
    films: [String!]
}
