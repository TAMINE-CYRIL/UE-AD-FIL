services:
  movie:
    build:
      context: .
      dockerfile: movie/Dockerfile
    ports:
      - "3200:3200"

  booking:
    build:
      context: .
      dockerfile: booking/Dockerfile
    ports:
      - "3201:3201"
    environment:
      - MOVIE_URL=http://movie:3200/graphql
      - SCHEDULE_URL=http://schedule:3202
    depends_on:
      - movie
      - schedule

  schedule:
    build:
      context: .
      dockerfile: schedule/Dockerfile
    ports:
      - "3202:3202"

  user:
    build:
      context: .
      dockerfile: user/Dockerfile
    ports:
      - "3203:3203"
    environment:
      - BOOKING_URL=http://booking:3201/graphql
    depends_on:
      - booking
