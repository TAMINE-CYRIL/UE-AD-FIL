services:
  movie:
    build:
      context: .
      dockerfile: movie/Dockerfile
    ports:
      - "${MOVIE_PORT}:3200"
    environment:
      - JWT_SECRET=${JWT_SECRET}

  booking:
    build:
      context: .
      dockerfile: booking/Dockerfile
    ports:
      - "${BOOKING_PORT}:3201"
    environment:
      - MOVIE_URL=${MOVIE_URL}
      - SCHEDULE_URL=${SCHEDULE_URL}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - movie
      - schedule

  schedule:
    build:
      context: .
      dockerfile: schedule/Dockerfile
    ports:
      - "${SCHEDULE_PORT}:3202"
    environment:
      - JWT_SECRET=${JWT_SECRET}

  user:
    build:
      context: .
      dockerfile: user/Dockerfile
    ports:
      - "${USER_PORT}:3203"
    environment:
      - BOOKING_URL=${BOOKING_URL}
      - JWT_SECRET=${JWT_SECRET}
      - MONGO_URL=${MONGO_URL}
    depends_on:
      - booking
      - mongo

  mongo:
    image: mongo
    restart: always
    ports:
      - "${MONGO_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - "${MONGO_EXPRESS_PORT}:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD}
      ME_CONFIG_MONGODB_URL: ${MONGO_URL}
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongo
