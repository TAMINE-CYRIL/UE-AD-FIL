services:
  movie:
    build:
      context: .
      dockerfile: movie/Dockerfile
    ports:
      - "${MOVIE_PORT}:3200"
    environment:
      - JWT_SECRET=${JWT_SECRET}

  booking:
    build:
      context: .
      dockerfile: booking/Dockerfile
    ports:
      - "${BOOKING_PORT}:3201"
    environment:
      - MOVIE_URL=${MOVIE_URL}
      - SCHEDULE_URL=${SCHEDULE_URL}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - movie
      - schedule

  schedule:
    build:
      context: .
      dockerfile: schedule/Dockerfile
    ports:
      - "${SCHEDULE_PORT}:3202"
    environment:
      - JWT_SECRET=${JWT_SECRET}

  user:
    build:
      context: .
      dockerfile: user/Dockerfile
    ports:
      - "${USER_PORT}:3203"
    environment:
      - BOOKING_URL=${BOOKING_URL}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - booking
